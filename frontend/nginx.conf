upstream field_api {
    zone field_api 64k;
    resolver 127.0.0.11 valid=3s ipv6=off;
    resolver_timeout 2s;
    server backend:8000 resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://field_api/;
        proxy_set_header X-Request-ID $request_id;
    }
    location / { try_files $uri $uri/ /index.html; }
}
